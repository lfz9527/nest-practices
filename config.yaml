# 环境配置

# 当前环境
env: development

# 服务端口
port: 3000

# MySQL 数据库连接
database:
  # 数据库主机
  host: localhost
  # 数据库端口
  port: 3306
  # 数据库用户名
  username: root
  # 数据库密码
  password: 'root'
  # 数据库名
  database: nest_practices

# 日志
logger:
  # 开发期 true 经 pino-pretty 输出可读日志；生产环境置 false 保持 JSON 到 stdout
  pretty: true
  file:
    enabled: true
    path: ./logs
    maxSize: 10        # MB

# JWT 配置
jwt:
  # 签名密钥（生产环境应通过环境变量注入，勿硬编码）
  secret: 'nest-practices-secret-key'
  # 令牌有效期
  expiresIn: '7d'
