# 环境配置

# 当前环境
env: development

# 服务端口
port: 3000

# MySQL 数据库连接
database:
  # 数据库主机
  host: localhost
  # 数据库端口
  port: 3306
  # 数据库用户名
  username: root
  # 数据库密码
  password: 'root'
  # 数据库名
  database: nest_practices

# 日志
logger:
  # 开发期 true 经 pino-pretty 输出可读日志；生产环境置 false 保持 JSON 到 stdout
  pretty: true
  file:
    enabled: true
    path: ./logs
    maxSize: 10        # MB

# Redis 连接（开发环境：WSL 内 Redis，经 portproxy 转发到本机 6379）
redis:
  host: 127.0.0.1
  port: 6379
  password: 'root'
  # 建立 Redis TCP 连接的超时时间，单位：毫秒
  connectTimeout: 5000
  # 单条 Redis 命令的超时时间，单位：毫秒
  commandTimeout: 3000
  # 自动重连的最大尝试次数，达到上限后停止重连但不退出应用
  maxRetries: 5
  # 单次重连退避时间的最大值，单位：毫秒
  retryDelayMax: 2000

# JWT 配置
jwt:
  # 签名密钥（生产环境应通过环境变量注入，勿硬编码）
  secret: 'nest-practices-secret-key'
  # access token 有效期（单位：秒，7 天）
  accessExpiresIn: 604800
